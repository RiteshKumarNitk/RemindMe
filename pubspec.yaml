name: medireminder
description: "A simple, reliable medicine reminder app for elderly users."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  app_settings: ^9.0.0
  cloud_firestore: ^6.8.0
  connectivity_plus: ^7.3.1
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^20.1.0
  flutter_localizations:
    sdk: flutter
  flutter_timezone: ^5.1.0
  flutter_tts: ^4.2.5
  intl: 0.20.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2
  sqflite_common_ffi_web: ^1.0.2
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.7+1

flutter:
  uses-material-design: true
  generate: true
