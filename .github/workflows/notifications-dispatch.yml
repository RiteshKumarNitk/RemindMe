name: Notification dispatcher

# Triggers platform/app/api/internal/notifications/dispatch — the recurring
# job that actually sends appointment reminders / missed-dose alerts
# (platform/docs/DEPLOYMENT.md "Scheduled jobs — notification dispatcher").
# Nothing was calling this endpoint on the live Vercel deployment before
# this workflow existed — the code was built and deployed, but no scheduler
# was ever wired up, so no notification has ever actually been sent.
#
# GitHub Actions does not reliably support sub-5-minute cron schedules (the
# documented target in DEPLOYMENT.md was 60s, written for a host with true
# per-minute cron, e.g. Vercel Pro). 5 minutes here is the honest floor for
# a free GitHub-Actions-based scheduler; the dispatcher is idempotent and
# claims whatever's due on each run, so this only means alerts can lag by
# up to ~5 minutes, not that anything is lost or double-sent.
#
# Setup required (cannot be done from here — needs the real secret value):
#   1. In Vercel: Project → Settings → Environment Variables → set
#      NOTIFICATIONS_CRON_SECRET to a long random value (e.g.
#      `openssl rand -hex 32`), for the Production environment. Redeploy.
#   2. In GitHub: Settings → Secrets and variables → Actions → New repository
#      secret → name it NOTIFICATIONS_CRON_SECRET → same value as step 1.
#   3. (Optional) Add repo variable APP_BASE_URL if the deployment URL ever
#      changes from the default below.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Call the dispatch endpoint
        run: |
          curl -fsS -m 50 -X POST \
            -H "X-Cron-Key: ${{ secrets.NOTIFICATIONS_CRON_SECRET }}" \
            "${{ vars.APP_BASE_URL || 'https://remind-me-indol.vercel.app' }}/api/internal/notifications/dispatch"
